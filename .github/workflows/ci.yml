name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck-build-verify:
    name: Typecheck, build, and verify demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict lint
        run: pnpm run lint:strict

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

      - name: Run demo verification
        run: |
          pnpm run api > /tmp/financeops-api.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          if ! curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
            echo "API failed to start"
            cat /tmp/financeops-api.log
            exit 1
          fi

          pnpm run verify:demo || {
            echo
            echo "---- API log ----"
            cat /tmp/financeops-api.log
            exit 1
          }
